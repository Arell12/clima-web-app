<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex-wrap items-center justify-center font-sans">

    <header class="w-full h-24">
        <div class="flex flex-row items-center">
            <img src="recursos/icon/logo_principal.png" alt="Logo principal"
                class="size-16 ml-4 mt-4">
            <p class="ml-4 mt-4 text-2xl">Atmósfera</p>
        </div>
    </header>

    <section class="w-full bg-gray-100 mt-3 flex justify-center">
        <div class="w-full max-w-[95%] h-auto bg-[url('recursos/icon/background_v4.jpg')] bg-cover bg-center bg-no-repeat flex flex-col md:flex-row rounded-lg shadow-xl">
            <div class="w-full md:w-1/2 h-auto  flex items-center justify-center flex-col py-4">
            <p class="text-stone-50 text-3xl font-bold">Villahermosa</p>
            <p class="pt-4 pb-4 text-stone-50">Lunes, 17 julio</p>
            <div class="w-1/2 bg-slate-50/85 p-2 grid grid-cols-2 gap-y-2 rounded-xl">

                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-bl from-indigo-800 to-violet-400 p-1 rounded-lg">
                        <img src="recursos/icon/viento_seccion1.png" alt="Viento" class="h-7">
                    </div>
                    <p class="text-sm">Viento</p>
                </div>

                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-bl from-indigo-800 to-violet-400 p-1 rounded-lg">
                        <img src="recursos/icon/lluvia_seccion1.png" alt="Lluvia" class="h-7">
                    </div>
                    <p class="text-sm">Lluvia</p>
                </div>

                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-bl from-indigo-800 to-violet-400 p-1 rounded-lg">
                        <img src="recursos/icon/temperatura_seccion1.png" alt="Temperatura" class="h-7">
                    </div>
                    <p class="text-sm">Temperatura</p>
                </div>

                <div class="flex items-center gap-2">
                    <div class="bg-gradient-to-bl from-indigo-800 to-violet-400 p-1 rounded-lg">
                        <img src="recursos/icon/humedad_seccion1.png" alt="Humedad" class="h-7">
                    </div>
                    <p class="text-sm">Humedad</p>
                </div>
            </div>
        </div>

        <div class="w-full md:w-1/2 h-64 flex items-center justify-center">
            <div
                class="bg-gradient-to-bl from-indigo-800 to-violet-400 w-1/3 h-3/4 rounded-lg flex flex-col items-center justify-center relative">
                <p class="absolute top-2 left-2 bg-slate-950/50 text-white text-sm px-2 py-1 rounded">Hoy</p>
                <img src="recursos/icon/sol_general.png" alt="Clima actual" class="size-20 ">

                <div class="flex items-start mt-1">
                    <p class="text-white text-3xl">23</p>
                    <p class="text-white text-sm mt-1 ml-1">°C</p>
                </div>

                <div class="flex items-center mt-1 space-x-1 text-white text-sm">
                    <p>21</p>
                    <p>°C</p>
                    <p>-</p>
                    <p>23</p>
                    <p>°C</p>
                </div>
            </div>
        </div>
        </div>
    </section>
    
    <section class="flex justify-center">
        <div class="bg-red-500 w-full max-w-[95%] h-52 mt-2 p-4">
            <div class="flex justify-between items-center">
                <div class="flex space-x-4"> 
                    <p>Hoy</p> 
                    <p class="ml-4">Semanal</p>
                </div>
                <div class="flex space-x-2">
                    <img src="recursos/icon/flecha-izquierda.png" alt="Flecha izquierda" class=" size-5 mr-5">
                    <img src="recursos/icon/flecha-derecha.png" alt="Flecha derecha" class="size-5">
                </div>
            </div>
            <div class=" w-full h-full max-h-[92%] bg-lime-100 mt-1 flex justify-between">
                <div class="h-full w-1/5 bg-slate-500 ml-1">
                </div>
                <div class="h-full w-1/5 bg-blue-500">
                </div>
                <div class="h-full w-1/5 bg-orange-500">
                </div>
                <div class="h-full w-1/5 bg-indigo-500 mr-1">
                </div>
            </div>
        </div>
    </section>
</body>

</html>
